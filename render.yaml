services:
  - type: web
    name: sgbau-results-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGIN
        value: https://yourusername.github.io   # ← replace with your GitHub Pages URL
      - key: DEFAULT_SESSION
        value: SE23
      - key: DEFAULT_SEM
        value: SM03
